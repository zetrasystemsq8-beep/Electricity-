name: Build PowerPal Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      # This project ships no android/ or ios/ folder in git (they're
      # platform scaffolding, not app code) - flutter create generates them
      # fresh, matching whatever Flutter version this workflow uses. This
      # avoids inheriting stale Gradle/AGP config from any other project.
      - name: Generate Android + iOS platform folders
        run: flutter create . --platforms=android,ios --org com.powerpal --project-name powerpal

      - name: Set the real package name and app label
        run: |
          OLD_MAIN=$(find android/app/src/main/kotlin -name MainActivity.kt)
          mkdir -p android/app/src/main/kotlin/com/powerpal/app
          mv "$OLD_MAIN" android/app/src/main/kotlin/com/powerpal/app/MainActivity.kt
          find android/app/src/main/kotlin/com/powerpal -type d -empty -delete
          sed -i 's/^package .*/package com.powerpal.app/' android/app/src/main/kotlin/com/powerpal/app/MainActivity.kt
          sed -i 's/android:label="[^"]*"/android:label="PowerPal"/' android/app/src/main/AndroidManifest.xml

      - name: Configure release signing
        run: |
          cat > android/app/build.gradle.kts <<'GRADLE'
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.powerpal.app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
              }

              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                      }
                  }
              }

              defaultConfig {
                  applicationId = "com.powerpal.app"
                  minSdk = 21
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }

          flutter {
              source = "../.."
          }
          GRADLE

      - name: Reconstruct Android signing files
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/powerpal.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=powerpal.jks
          PROPS

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerpal-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
