name: Build PowerPal Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Generate Android + iOS platform folders
        run: flutter create . --platforms=android,ios --org com.powerpal --project-name powerpal

      - name: Set the real package name and app label
        run: |
          OLD_MAIN=$(find android/app/src/main/kotlin -name MainActivity.kt)
          mkdir -p android/app/src/main/kotlin/com/powerpal/app
          mv "$OLD_MAIN" android/app/src/main/kotlin/com/powerpal/app/MainActivity.kt
          find android/app/src/main/kotlin/com/powerpal -type d -empty -delete
          sed -i 's/^package .*/package com.powerpal.app/' android/app/src/main/kotlin/com/powerpal/app/MainActivity.kt
          sed -i 's/android:label="[^"]*"/android:label="PowerPal"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/^\(\s*applicationId = \).*/\1"com.powerpal.app"/' android/app/build.gradle.kts
          sed -i 's/^\(\s*namespace = \).*/\1"com.powerpal.app"/' android/app/build.gradle.kts

      - name: Insert release signing config
        run: |
          python3 - <<'PYEOF'
          import re

          path = "android/app/build.gradle.kts"
          content = open(path).read()

          header = (
              'import java.util.Properties\n'
              'import java.io.FileInputStream\n\n'
              'val keystoreProperties = Properties()\n'
              'val keystorePropertiesFile = rootProject.file("key.properties")\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
          )
          content = header + content

          signing_block = (
              '\n    signingConfigs {\n'
              '        create("release") {\n'
              '            if (keystorePropertiesFile.exists()) {\n'
              '                storeFile = file(keystoreProperties["storeFile"] as String)\n'
              '                storePassword = keystoreProperties["storePassword"] as String\n'
              '                keyAlias = keystoreProperties["keyAlias"] as String\n'
              '                keyPassword = keystoreProperties["keyPassword"] as String\n'
              '            }\n'
              '        }\n'
              '    }\n'
          )
          content = re.sub(r'(android \{\n)', r'\1' + signing_block, content, count=1)

          content = re.sub(
              r'signingConfig = signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              content,
          )

          open(path, "w").write(content)
          PYEOF
          cat android/app/build.gradle.kts

      - name: Reconstruct Android signing files
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/powerpal.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=powerpal.jks
          PROPS

      - name: Verify the keystore is readable
        run: |
          keytool -list -keystore android/app/powerpal.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
          || (echo "::error::The ANDROID_KEYSTORE_BASE64 secret does not decode to a valid keystore, or the password doesn't match it. Regenerate with: base64 -w0 powerpal.jks and re-paste the full output into the GitHub secret." && exit 1)

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerpal-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
